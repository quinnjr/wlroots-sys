# and the safe public item a consumer calls to get its effect. See README.md in
# this directory for the format, the rules, and how to edit this file.
#
# Every row is validated twice by `cargo test -p wlr --test coverage_audit`:
# the symbol must exist in the generated bindings, and it must still appear in
