name: CI

on:
  push:
    branches: [main, develop, 'support/**']
  pull_request:
    branches: [main, develop, 'support/**']

# This job builds PR code, and building Rust means executing build.rs. It needs
# to read the repo and nothing else.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Arch is currently the only distro shipping wlroots 0.20. That also makes
    # this workflow unpinnable in one respect: `pacman -Syu` against a rolling
    # distro pulls whatever rustc and wlroots are current, so a new clippy lint
    # or a wlroots patch can redden an unrelated PR. Accepted deliberately —
    # `-D warnings` is therefore scoped to the lint steps rather than global, so
    # upstream lint churn cannot fail `build` and `test` too.
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          # Refresh the keyring first: a stale one in the base image is the
          # classic `pacman -Syu` container failure.
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm \
            git rust clang pkgconf \
            wlroots0.20 wayland wayland-protocols \
            libxkbcommon libinput libdrm pixman mesa vulkan-headers

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show toolchain and wlroots version
        run: |
          cargo --version
          rustc --version
          pkg-config --modversion wlroots-0.20

      - name: Verify vendored protocol XML is unmodified
        working-directory: crates/wlr-sys/protocol
        run: sha256sum -c SHA256SUMS

      # --- default features -------------------------------------------------
      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings

      # Workspace-wide, so this already builds and tests `wlr` alongside
      # `wlr-sys` — no separate `-p wlr` step is needed. `wlr` binds this
      # branch's wlroots minor; older minors live on their own support/*
      # branches, each running this same job against its own wlroots, since
      # cargo cannot resolve a manifest listing two `wlr-sys` versions.
      - run: cargo test --workspace

      # 100% is defined in the all-features configuration, so the ledgers are
      # reconciled against those bindings. WLR_COVERAGE_ALL_FEATURES is what
      # turns "ledger names a symbol bindgen never emitted" into a hard failure;
      # a smaller feature set binds a subset and would report every gated row.
      # WLR_COVERAGE_BINDINGS is resolved here rather than left to the audit's
      # own newest-mtime search: any later cargo invocation that builds wlr-sys
      # in a different configuration writes a newer bindings.rs, and the audit
      # would then silently reconcile against a subset.
      - name: Coverage audit (all features)
        run: |
          cargo build -p wlr-sys --all-features
          bindings=$(find target/debug/build -maxdepth 3 -name bindings.rs -path '*wlr-sys*' \
            -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          echo "ground truth: $bindings"
          export WLR_COVERAGE_BINDINGS="$bindings"
          cargo test -p wlr --all-features --test coverage_audit
          # Informational: the burn-down table, so a milestone's progress is
          # visible in the log without anyone running it locally.
          cargo run -p xtask -- coverage
        env:
          WLR_COVERAGE_ALL_FEATURES: 1

      # The same gate against the no-default-features bindings — a subset, so
      # the other three checks must still hold.
      #
      # Pinned the same way as the step above, and for the same reason. This
      # used to rely on being the last thing to have built wlr-sys, so the
      # audit's newest-mtime search happened to land on the right file. That
      # is a property of step order, not of this step: the all-features build
      # immediately above writes a *newer* bindings.rs, so anything that stops
      # this command from rewriting its own — a cache hit, a reordering, a new
      # step inserted between — silently reconciles the subset config against
      # the superset's ground truth. The preceding step's own comment
      # documents that hazard; this one was exposed to it.
      - name: Coverage audit (no default features)
        run: |
          # Built into its own target directory, so the only wlr-sys
          # bindings.rs underneath it is this configuration's. Selecting by
          # newest mtime in the shared directory would be ambiguous — the
          # all-features build above put a newer one there — and a freshness
          # window would fail on a legitimate cache hit, where the build
          # script does not re-run and the file keeps its old timestamp.
          # Isolation answers the question by construction instead.
          export CARGO_TARGET_DIR=target/coverage-nodefault
          cargo build -p wlr-sys --no-default-features
          bindings=$(find "$CARGO_TARGET_DIR/debug/build" -maxdepth 3 -name bindings.rs \
            -path '*wlr-sys*' | head -1)
          if [ -z "$bindings" ]; then
            echo "::error::no wlr-sys bindings.rs under $CARGO_TARGET_DIR"
            exit 1
          fi
          echo "ground truth: $bindings"
          export WLR_COVERAGE_BINDINGS="$bindings"
          cargo test -p wlr --no-default-features --test coverage_audit

      # The README is the crate's rustdoc (`#![doc = include_str!(...)]`), so a
      # broken link or fence in it breaks documentation builds.
      - run: cargo doc -p wlr-sys --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # `wlr` too, and not only for symmetry: its rustdoc is the crate's front
      # page and its `pub(crate)` constructors are easy to link to by accident
      # from public docs, which `-D warnings` rejects and nothing else catches.
      # Three such links reached a release branch before this step existed.
      - run: cargo doc -p wlr --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - run: cargo run -p wlr-sys --example headless

      # --- non-default feature sets ----------------------------------------
      # `cargo test`, not `cargo build`: the latter never compiles tests/, which
      # is where the type-identity and subsystem-symbol safety nets live.
      - run: cargo test -p wlr-sys --no-default-features

      # Mixed sets, which all-on/all-off never reach. `drm-backend` alone
      # exercises the transitive `wlr/backend/session.h` include; `libinput-backend`
      # alone exercises the optional input-sys dependency and its blocklist
      # extension — the path tests/interop.rs guards.
      - run: cargo test -p wlr-sys --no-default-features --features drm-backend
      - run: cargo test -p wlr-sys --no-default-features --features libinput-backend

      - run: cargo test -p wlr-sys --features vulkan-renderer
      - run: cargo clippy -p wlr-sys --all-targets --all-features
        env:
          RUSTFLAGS: -D warnings

      # src/signal.rs declares wl_signal_emit_mutable itself and build.rs puts
      # -lwayland-server on the link line so that declaration resolves no matter
      # how wayland-sys was configured. `dlopen` removes wayland-sys's #[link],
      # so this job is the only thing that proves that claim.
      - run: cargo test -p wlr-sys --features wayland-sys/dlopen

      # ...and the same configuration under -D warnings, which the line above
      # does not do. `ffi_dispatch!` has two expansions: without `dlopen` it
      # calls the symbol as a bare name, so the `wayland_sys::server::*` glob is
      # required; with `dlopen` it goes through the handle's function table and
      # the glob is unused. An import mandatory in one configuration is a lint
      # error in the other, and until this step existed the two jobs never
      # intersected — the lint job ran without `dlopen`, the `dlopen` job ran
      # without the lint. Two such errors shipped in published releases.
      - run: cargo clippy -p wlr-sys --all-targets --features wayland-sys/dlopen
        env:
          RUSTFLAGS: -D warnings

      # --- release hygiene --------------------------------------------------
      - name: docs.rs fallback still builds
        run: cargo doc -p wlr-sys --no-deps --all-features
        env:
          DOCS_RS: 1
          RUSTDOCFLAGS: -D warnings

      - name: Committed bindings snapshot is current
        run: |
          cargo build -p wlr-sys --all-features
          latest=$(find target/debug/build -maxdepth 3 -name bindings.rs -path '*wlr-sys*' \
            -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          diff -u crates/wlr-sys/prebuilt/bindings-docsrs.rs "$latest" || {
            echo "::error::prebuilt/bindings-docsrs.rs is stale; see docs/RELEASING.md"
            exit 1
          }

      # Builds from a clean extraction, which is where a missing protocol/*.xml
      # or an include_str! escaping the package root first shows up. A published
      # version can only be yanked, never replaced.
      - run: cargo package -p wlr-sys --allow-dirty

  miri:
    # Validates the reentrancy-deferring dispatcher in `wlr` under Miri, which
    # caught a real harness bug during its development. Scoped to
    # `dispatch::tests` deliberately and only that filter: those tests are pure
    # Rust with no wlroots/libwayland calls. `id::tests`, `backend::tests`,
    # `output::tests` and the integration tests all cross into FFI, which Miri
    # cannot execute — widening this job to the full suite will fail it, not
    # improve its coverage.
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm \
            git rustup clang pkgconf \
            wlroots0.20 wayland wayland-protocols \
            libxkbcommon libinput libdrm pixman mesa vulkan-headers
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install nightly Miri
        run: |
          rustup toolchain install nightly --profile minimal --component miri
      - run: cargo +nightly miri test -p wlr dispatch::tests
      # Tree Borrows is the stricter, newer aliasing model; running both
      # catches divergent verdicts that either model alone would miss.
      - run: cargo +nightly miri test -p wlr dispatch::tests
        env:
          MIRIFLAGS: -Zmiri-tree-borrows

  msrv:
    # rust-version in Cargo.toml is a published promise; nothing else checks it.
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm \
            git rustup clang pkgconf \
            wlroots0.20 wayland wayland-protocols \
            libxkbcommon libinput libdrm pixman mesa vulkan-headers
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the declared MSRV
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          echo "MSRV is $msrv"
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"
      - run: cargo check --workspace --all-features
