name: fuzz
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:

# This job builds the repo, and building Rust means executing build.rs (which
# calls pkg-config and clang). It needs to read the repo and nothing else.
permissions:
  contents: read

jobs:
  operations:
    # wlroots 0.20 is not packaged by the runner image, and `cargo-fuzz` builds
    # `wlr` -> `wlr-sys`, whose build.rs panics without the wlroots-0.20
    # headers. Mirror `ci.yml`'s `test`/`miri` jobs' container and dependency
    # set for exactly that reason. Arch is currently the only distro shipping
    # wlroots 0.20.
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          # Refresh the keyring first: a stale one in the base image is the
          # classic `pacman -Syu` container failure.
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm \
            git rustup clang pkgconf \
            wlroots0.20 wayland wayland-protocols \
            libxkbcommon libinput libdrm pixman mesa vulkan-headers

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the nightly toolchain
        run: |
          # Dated, not floating `nightly`: the fuzz job runs unattended against
          # a rolling distro, so an upstream nightly regression would otherwise
          # be discovered as a red nightly cron rather than a deliberate bump.
          rustup toolchain install nightly-2026-09-12 --profile minimal
          rustup default nightly-2026-09-12

      - run: cargo install cargo-fuzz --version 0.13.2 --locked

      # cargo-fuzz has no `--locked` of its own, so build through cargo first:
      # this resolves strictly against the committed fuzz/Cargo.lock, and an
      # out-of-date lock fails the step instead of silently re-resolving. The
      # fuzz run that follows then reuses that same lock.
      - name: Build fuzz target against the committed lockfile
        run: cargo +nightly-2026-09-12 build --manifest-path fuzz/Cargo.toml --locked --bin operations

      # Persist the corpus between nightly runs. The key rolls each run (a cache
      # entry is immutable, so a fixed key would freeze the corpus at its first
      # save); restore-keys pulls back the most recent entry for this target.
      # Keyed on the target name so a second fuzz target gets its own cache.
      - name: Cache the fuzz corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-operations-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-operations-

      # `seeds/operations` holds the checked-in seed inputs, passed as a second
      # libFuzzer corpus directory: `fuzz/corpus/` (the cache above) is
      # gitignored and cold-starts empty, so without this the nightly would
      # start every run from nothing. Directory order matters: libFuzzer loads
      # every corpus dir but writes new coverage only to the first, so the
      # checked-in seeds stay pristine while the run accumulates into the
      # cached corpus. `-max_len` caps input bytes; the per-operation turn
      # budgets inside the target keep the work per input finite and
      # deterministic.
      - run: |
          mkdir -p corpus/operations
          cargo +nightly-2026-09-12 fuzz run operations corpus/operations seeds/operations -- -max_total_time=300 -max_len=2048
        working-directory: fuzz

      # A crash writes its reproducer under fuzz/artifacts/, which is gitignored
      # and lives only in this container. Upload it or the one thing this job
      # exists to produce dies with the runner.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts-operations
          path: fuzz/artifacts/**
          if-no-files-found: ignore
