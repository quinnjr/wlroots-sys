name: fuzz
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
jobs:
  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz
      - run: cargo +nightly fuzz run operations -- -max_total_time=300
        working-directory: fuzz
